<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Lumen Card — тест-стенд</title>
<style>
/* ------------------------------------------------------------------ */
/* Каркас стенда                                                       */
/* ------------------------------------------------------------------ */
html { font-size: 16px; }
body {
    margin: 0;
    background: #070605;
    color: #F3EDE4;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
}
#stage-wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
#stage {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #0B0908;
    -webkit-transform-origin: top left;
    transform-origin: top left;
}

/* Корень компонента full (аналог this.html в Lampa) */
#component {
    position: relative;
    width: 100%;
    height: 1080px;
    overflow: hidden;
}
#component .scroll { height: 100%; overflow: hidden; }
#component .scroll__body { display: flex; flex-direction: column; justify-content: flex-end; min-height: 100%; }

/* Панель управления стендом */
#panel {
    position: fixed; right: 12px; top: 12px; z-index: 50;
    background: rgba(12,10,9,0.92); border: 1px solid rgba(243,237,228,0.18);
    border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5;
    max-width: 330px; max-height: 92vh; overflow: auto;
}
#panel h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #A89A8A; }
#panel button {
    background: rgba(243,237,228,0.1); color: #F3EDE4; border: 1px solid rgba(243,237,228,0.2);
    border-radius: 7px; padding: 6px 11px; margin: 0 6px 6px 0; cursor: pointer; font-size: 13px;
}
#panel button.on { background: #E8B87A; color: #1A120A; border-color: #FFF2DC; }
#panel .hint { color: #7A6A5A; font-size: 12px; margin-top: 8px; }
#checks { margin-top: 10px; border-top: 1px solid rgba(243,237,228,0.14); padding-top: 8px; font-family: Consolas, monospace; font-size: 12px; }
#checks .ok { color: #8FBF7A; }
#checks .fail { color: #E4604B; }
#errors { margin-top: 8px; color: #E4604B; font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; }

/* ------------------------------------------------------------------ */
/* Базовый CSS Lampa (перенос ключевых правил из start_new.scss /       */
/* full_start.scss; $offset = 1.5em, $bg_transparent = rgba(255,255,255,.1)) */
/* ------------------------------------------------------------------ */
.hide { display: none !important; }

.full-start-new { padding: 0 1.5em; padding-bottom: 4em; }
.full-start-new__body { display: flex; align-items: flex-end; }
.full-start-new__left { flex-shrink: 0; width: 17em; margin-right: 3em; }
.full-start-new__right { flex-grow: 1; }
.full-start-new__poster { position: relative; padding-bottom: 150%; background-color: #2a2422; border-radius: 1em; }
.full-start-new__img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 1em; opacity: 0; }
.full-start-new__poster.loaded img { opacity: 1; }
.full-start-new__head { color: rgba(255,255,255,0.6); font-size: 1.2em; }
.full-start-new__head span { color: #fff; }
.full-start-new__title {
    font-size: 4em; font-weight: 600; margin-bottom: .2em; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    margin-left: -.03em; line-height: 1.3;
}
.full-start-new__title.twolines { -webkit-line-clamp: 2; font-size: 3.5em; }
.full-start-new__tagline { font-size: 1.8em; line-height: 1.2; margin-bottom: 1em; margin-top: -.3em; }
.full-start-new__details {
    color: #fff; margin: -.45em; margin-bottom: 1em; display: flex; align-items: center;
    flex-wrap: wrap; min-height: 1.9em; font-size: 1.1em;
}
.full-start-new__details > * { margin: .45em; }
.full-start-new__split { font-size: .7em; }
.full-start-new__reactions { display: flex; flex-wrap: wrap; margin: -.5em; margin-bottom: 1em; min-height: 3.6em; align-items: center; }
.full-start-new__reactions > div { padding: .5em; }
.full-start-new__rate-line { display: flex; margin-bottom: 2.2em; align-items: center; }
.full-start-new__rate-line .full-start__rate { margin: 0; }
.full-start-new__rate-line > * { margin-left: 0 !important; margin-right: 1em !important; }
.full-start-new__rate-line .full-start__pg { font-size: 1.12em; }
.full-start-new__buttons { display: flex; align-items: center; }
.full-start-new__buttons .full-start__button:not(.focus) span { display: none; }

.full-start__pg, .full-start__status { font-size: 1.2em; border: 1px solid #fff; border-radius: .2em; padding: .3em; }
.full-start__tag {
    border-radius: .6em; display: flex; align-items: center; margin-right: 1em; font-size: 1.15em;
    white-space: nowrap; margin-bottom: .4em; background-color: rgba(255,255,255,.1); padding: .3em .5em .3em .3em;
}
.full-start__tag > div { overflow: hidden; text-overflow: ellipsis; }
.full-start__tag.tag--quality { border-radius: .6em; background: #ffe216; color: #000; padding: .3em .4em; text-transform: uppercase; }
.full-start__button {
    margin-right: .75em; font-size: 1.3em; background-color: rgba(255,255,255,.1); padding: .3em 1em;
    display: flex; border-radius: 1em; align-items: center; height: 2.8em; flex-shrink: 0;
}
.full-start__button > svg { width: 1.5em; height: 1.5em; flex-shrink: 0; }
.full-start__button > svg + span { margin-left: .75em; margin-top: -.2em; }
.full-start__button.focus { background-color: #fff; color: #000; }
.full-start__rate {
    background: rgba(0,0,0,.15); border-radius: .3em; display: flex; align-items: center;
    font-size: 1.45em; margin-right: 1em;
}
.full-start__rate > div:first-child {
    width: 1.8em; height: 1.5em; flex-shrink: 0; background: rgba(0,0,0,.15); border-radius: .3em;
    display: flex; align-items: center; justify-content: center;
}
.full-start__rate > div:last-child { font-size: .7em; padding: 0 .5em; }
.full-start__background {
    position: absolute; left: 8em; width: 100%; z-index: -1; opacity: 0;
    height: 108%; top: -6em; transition: opacity .5s ease-in-out;
}
.full-start__background.loaded { opacity: .5; }

/* ------------------------------------------------------------------ */
/* Эмуляция vh внутри масштабированной сцены 1920x1080.                 */
/* В реальной Lampa 100vh/74vh считаются от окна — здесь от сцены.       */
/* ------------------------------------------------------------------ */
#stage .lumen-backdrop { height: 1080px; }
#stage .lumen-card .full-start-new__body { min-height: 800px; }

/* Стенд всегда эмулирует ширину 1920px, а media-запросы плагина смотрят на
   реальное окно браузера. Правка 2026-09-16 (п.1): компактной раскладки для
   .lumen-content больше нет — колонка всегда одна, отменять нечего. */
</style>
</head>
<body>

<div id="stage-wrap">

    <div id="component" class="activity__body layer--wheight">
      <div class="scroll"><div class="scroll__body"></div></div>

<div id="panel">
  <h4>Lumen Card — стенд</h4>
  <div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
/* =================================================================== */
/* Минимальная эмуляция Lampa API                                      */
/* =================================================================== */
(function () {
    'use strict';

    var errors = [];
    window.onerror = function (msg, src, line) {
        errors.push(msg + ' @' + (src || '').split('/').pop() + ':' + line);
        renderErrors();
    };
    function renderErrors() {
        document.getElementById('errors').textContent = errors.length ? ('JS ERRORS:\n' + errors.join('\n')) : '';
    }
    window.__harnessErrors = errors;

    /* ---------------- Subscribe ---------------- */
    function Subscribe() {
        var list = [];
        return {
            follow: function (name, cb) { list.push({ name: name, cb: cb }); },
            remove: function (name, cb) {
                for (var i = list.length - 1; i >= 0; i--) if (list[i].name === name && list[i].cb === cb) list.splice(i, 1);
            },
            send: function (name, data) {
                for (var i = 0; i < list.length; i++) {
                    if (list[i].name === name) {
                        try { list[i].cb(data); } catch (e) { errors.push('listener ' + name + ': ' + e.message); renderErrors(); }
                    }
                }
            }
        };
    }

    /* ---------------- Lang ---------------- */
    var DICT = {
        ru: {
            reactions_none: 'Оценить',
            title_watch: 'Смотреть',
            settings_input_links: 'Ссылки',
            title_reactions: 'Реакции',
            title_subscribe: 'Подписаться',
            full_torrents: 'Торренты',
            full_trailers: 'Трейлеры',
            title_seasons: 'Сезоны',
            title_episodes: 'Серии',
            player_quality: 'Качество',
            full_next_episode: 'Следующая серия',
            full_episode_days_left: 'Осталось дней',
            full_notext: 'Нет описания',
            tv_status_released: 'Выпущенный',
            tv_status_returning_series: 'Выходит',
            tv_status_ended: 'Завершён',
            tv_status_canceled: 'Отменён'
        }
    };

    var Lang = {
        add: function (pack) {
            for (var key in pack) {
                if (!pack.hasOwnProperty(key)) continue;
                DICT.ru[key] = pack[key].ru || pack[key].en || key;
            }
        },
        translate: function (str) {
            if (typeof str !== 'string') return str;
            if (str.indexOf('#{') >= 0) {
                return str.replace(/#\{([^}]+)\}/g, function (all, key) {
                    return typeof DICT.ru[key] !== 'undefined' ? DICT.ru[key] : key;
                });
            }
            return typeof DICT.ru[str] !== 'undefined' ? DICT.ru[str] : str;
        },
        selected: function () { return true; }
    };

    /* ---------------- Template ---------------- */
    var templates = {};
    var Template = {
        add: function (name, html) { templates[name] = html; },
        all: function () { return templates; },
        get: function (name, vars, like_static) {
            var tpl = templates[name];
            if (!tpl) throw 'Template [' + name + '] not found';
            tpl = Lang.translate(tpl);
            vars = vars || {};
            for (var n in vars) {
                if (!vars.hasOwnProperty(n)) continue;
                tpl = tpl.replace(new RegExp('{' + n + '}', 'g'), vars[n]);
            }
            return like_static ? tpl : $(tpl);
        },
        elem: function (tag, opts) {
            var el = document.createElement(tag);
            if (opts && opts['class']) el.setAttribute('class', opts['class']);
            return el;
        }
    };

    /* Оригинальный шаблон full_start_new (src/templates/full/start_new.js) */
    templates.full_start_new = [
        '<div class="full-start-new">',
        '<div class="full-start-new__body">',
        '<div class="full-start-new__left"><div class="full-start-new__poster"><img class="full-start-new__img full--poster" /></div></div>',
        '<div class="full-start-new__right">',
        '<div class="full-start-new__head"></div>',
        '<div class="full-start-new__title">{title}</div>',
        '<div class="full-start-new__tagline full--tagline">{tagline}</div>',
        '<div class="full-start-new__rate-line">',
        '<div class="full-start__rate rate--tmdb"><div>{rating}</div><div class="source--name">TMDB</div></div>',
        '<div class="full-start__rate rate--imdb hide"><div></div><div>IMDB</div></div>',
        '<div class="full-start__rate rate--kp hide"><div></div><div>KP</div></div>',
        '<div class="full-start__pg hide"></div>',
        '<div class="full-start__status hide"></div>',
        '</div>',
        '<div class="full-start-new__details"></div>',
        '<div class="full-start-new__reactions"><div>#{reactions_none}</div></div>',
        '<div class="full-start-new__buttons">',
        "\n                <div class=\"full-start__button selector button--play\">\n                    <svg><use xlink:href=\"#sprite-play\"></use></svg>\n\n                    <span>#{title_watch}</span>\n                </div>\n\n                <div class=\"full-start__button selector button--book\">\n                    <svg width=\"21\" height=\"32\" viewBox=\"0 0 21 32\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                        <path d=\"M2 1.5H19C19.2761 1.5 19.5 1.72386 19.5 2V27.9618C19.5 28.3756 19.0261 28.6103 18.697 28.3595L12.6212 23.7303C11.3682 22.7757 9.63183 22.7757 8.37885 23.7303L2.30302 28.3595C1.9739 28.6103 1.5 28.3756 1.5 27.9618V2C1.5 1.72386 1.72386 1.5 2 1.5Z\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n                    </svg>\n\n                    <span>#{settings_input_links}</span>\n                </div>\n\n                <div class=\"full-start__button selector button--reaction\">\n                    <svg><use xlink:href=\"#sprite-reaction\"></use></svg>           \n\n                    <span>#{title_reactions}</span>\n                </div>\n\n                <div class=\"full-start__button selector button--subscribe hide\">\n                    <svg viewBox=\"0 0 25 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                        <path d=\"M6.01892 24C6.27423 27.3562 9.07836 30 12.5 30C15.9216 30 18.7257 27.3562 18.981 24H15.9645C15.7219 25.6961 14.2632 27 12.5 27C10.7367 27 9.27804 25.6961 9.03542 24H6.01892Z\" fill=\"currentColor\"></path>\n                        <path d=\"M3.81972 14.5957V10.2679C3.81972 5.41336 7.7181 1.5 12.5 1.5C17.2819 1.5 21.1803 5.41336 21.1803 10.2679V14.5957C21.1803 15.8462 21.5399 17.0709 22.2168 18.1213L23.0727 19.4494C24.2077 21.2106 22.9392 23.5 20.9098 23.5H4.09021C2.06084 23.5 0.792282 21.2106 1.9273 19.4494L2.78317 18.1213C3.46012 17.0709 3.81972 15.8462 3.81972 14.5957Z\" stroke=\"currentColor\" stroke-width=\"2.6\"></path>\n                    </svg>\n\n                    <span>#{title_subscribe}</span>\n                </div>\n\n                <div class=\"full-start__button selector button--options\">\n                    <svg><use xlink:href=\"#sprite-dots\"></use></svg>\n                </div>\n            ",
        '</div></div></div>',
        '<div class="hide buttons--container">',
        "\n        <div class=\"full-start__button view--torrent hide\">\n            <svg><use xlink:href=\"#sprite-torrent\"></use></svg>\n\n            <span>#{full_torrents}</span>\n        </div>\n\n        <div class=\"full-start__button selector view--trailer\">\n            <svg><use xlink:href=\"#sprite-trailer\"></use></svg>\n\n            <span>#{full_trailers}</span>\n        </div>\n    ",
        '</div>',
        '</div>'
    ].join('');

    /* ---------------- Storage ---------------- */
    /* Долг ревью Task 9 (п.5): мок держал значения только в своём объекте и в
       localStorage не писал ничего. Кэш отзывов (src/60_reviews.js, stored())
       проверяет факт записи по самому localStorage — в стенде проверка была
       всегда отрицательной, put() считал, что кончилась квота, и вызывал
       purge(): кэш отзывов в стенде был фактически выключен, а его ветки —
       непокрыты. Теперь мок пишет строкой, как вендор (Storage.set ->
       localStorage.setItem(name, JSON.stringify(value))), и уважает nolisten
       (четвёртый аргумент Lampa — кэш пишет с ним, чтобы не будить
       подписчиков на каждую запись). */
    var store = {};
    var storageListener = Subscribe();

    function lsWrite(name, value) {
        try { window.localStorage.setItem(name, JSON.stringify(value)); } catch (e) { }
    }
    function lsRead(name) {
        try {
            var raw = window.localStorage.getItem(name);
            if (raw === null || raw === '') return undefined;
            return JSON.parse(raw);
        } catch (e) { return undefined; }
    }

    var Storage = {
        get: function (name, def) {
            if (typeof store[name] === 'undefined') {
                var saved = lsRead(name);
                if (typeof saved !== 'undefined') store[name] = saved;
            }
            return typeof store[name] !== 'undefined' ? store[name] : def;
        },
        set: function (name, value, nolisten) {
            store[name] = value;
            /* Стенд и живая Lampa живут в ОДНОМ origin (localhost:8766), то есть
               делят localStorage. Ключ Кинопоиска — данные пользователя, и
               заглушка 'harness-mock' (плюс её временное обнуление в проверке
               экрана 13) попадала прямо в настройки живой Lampa. Держим этот
               ключ только в памяти стенда: проверки читают его через тот же
               Storage.get и ничего не теряют. */
            if (name !== 'lumen_kp_key') lsWrite(name, value);
            if (!nolisten) storageListener.send('change', { name: name, value: value });
        },
        field: function (name) { return Storage.get(name); },
        listener: storageListener
    };
    /* Ревью Task 10 (п.6): ключи кэша отзывов живут в origin стенда и
       переживают перезагрузку — второй прогон рисовал бы ряд из кэша, а не из
       мок-ответа, и проверки молча перестали бы проверять сеть. Чистим на
       старте только своё, чужое в localStorage не трогаем. */
    (function clearReviewCache() {
        try {
            var kill = [], i, k;
            for (i = 0; i < window.localStorage.length; i++) {
                k = window.localStorage.key(i);
                if (k && k.indexOf('lumen_rv_') === 0) kill.push(k);
            }
            for (i = 0; i < kill.length; i++) window.localStorage.removeItem(kill[i]);
        } catch (e) { }
    })();

    store.language = 'ru';
    store.poster_size = 'w500';
    /* Task 9: ключ-заглушка — сеть в стенде подменена (см. Reguest ниже),
       настоящий ключ Кинопоиска здесь не нужен и не используется. */
    store.lumen_kp_key = 'harness-mock';

    /* ---------------- Utils ---------------- */
    var Utils = {
        hash: function (str) {
            var h = 0, i, chr;
            str = '' + str;
            if (str.length === 0) return h;
            for (i = 0; i < str.length; i++) {
                chr = str.charCodeAt(i);
                h = ((h << 5) - h) + chr;
                h |= 0;
            }
            return Math.abs(h);
        },
        secondsToTime: function (sec, force) {
            sec = Math.round(sec || 0);
            var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            function p(n) { return n < 10 ? '0' + n : '' + n; }
            if (force) return h ? (h + ':' + p(m)) : (p(m) + ':' + p(s));
            return p(h) + ':' + p(m) + ':' + p(s);
        },
        substr: function (str, len) {
            str = '' + (str || '');
            return str.length > len ? str.slice(0, len) + '...' : str;
        },
        capitalizeFirstLetter: function (str) {
            str = '' + (str || '');
            return str.charAt(0).toUpperCase() + str.slice(1);
        },
        countSeasons: function (card) { return card.number_of_seasons || 0; },
        parseToDate: function (str) {
            var p = ('' + str).split('-');
            return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
        },
        parseTime: function (str) {
            var months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
            var d = Utils.parseToDate(str);
            return { short: d.getDate() + ' ' + months[d.getMonth()], full: str };
        },
        shortText: function (str, len) { return Utils.substr(str, len); }
    };

    /* ---------------- Timeline ---------------- */
    var views = {};
    var Timeline = {
        setup: function (hash, road) { views[hash] = road; },
        view: function (hash) {
            var road = views[hash] || { percent: 0, time: 0, duration: 0, updated: 0 };
            return {
                hash: hash,
                percent: road.percent,
                time: road.time,
                duration: road.duration,
                profile: 0,
                updated: road.updated || 0,
                handler: function () { }
            };

    var KP_SEARCH = { total: 1, items: [{ kinopoiskId: 301, imdbId: 'tt15239678' }] };

            { type: 'NEUTRAL', date: '2024-03-05T09:00:00', positiveRating: 4, negativeRating: 1, author: 'Мария Кузнецова', title: 'Красиво, но холодно', description: 'Визуально шедевр, эмоционально держит на расстоянии.' },
            { type: 'NEGATIVE', date: '2024-03-09T21:00:00', positiveRating: 7, negativeRating: 9, author: 'Алексей Дёмин', title: 'Три часа ожидания', description: 'Сюжет топчется на месте, второй час можно было вырезать.' }
        ]
    };

    function Reguest() { }
    Reguest.prototype.timeout = function () { };
    Reguest.prototype.silent = function (url, ok) {

           стенд писал бы в консоль «Lampa.Modal.listener not found». */

        addParam: function (p) {
            SettingsApi.params.push(p);
            if (p.param && typeof p.param['default'] !== 'undefined' && typeof store[p.param.name] === 'undefined') {
                store[p.param.name] = p.param['default'];
            }

    window.Lampa = {

<script src="../dist/lumen_card.js"></script>

<script>
/* =================================================================== */
/* Данные + рендер по логике src/components/full/start.js              */
/* =================================================================== */
(function () {
    'use strict';

    var L = window.Lampa;

    /* --------------------------- Данные --------------------------- */
    var MOVIE = {
        id: 693135,                       /* id % 3 === 0 -> тёплый процедурный фон */
        title: 'Дюна: Часть вторая',
        original_title: 'Dune: Part Two',
        overview: 'Пол Атрейдес объединяется с Чани и фрименами, чтобы отомстить заговорщикам, уничтожившим его семью. Ему предстоит выбор между любовью всей жизни и судьбой известной вселенной.',
        release_date: '2024-02-27',
        runtime: 166,
        vote_average: 8.243,
        /* Task 9: без imdb_id отзывы Кинопоиска не запрашиваются вовсе —
           это тот же id, что отдаёт живая карточка «Дюны» (план 0.5). */
        imdb_id: 'tt15239678',
        imdb_rating: 8.5,
        kp_rating: 7.9,
        release_quality: 'BD 4K',
        backdrop_path: '/xOMo8BRK7PfcJv9JCnx7s5hj0PX.jpg',
        poster_path: '/czembW0Rk1Ke7lCJGahbOhdCuhV.jpg',
        status: 'Released',
        tagline: '',
        genres: [{ name: 'фантастика' }, { name: 'приключения' }],
        production_countries: [{ name: 'США' }],
        __pg: '18+'
    };

    var SERIAL = {
        id: 106378,                       /* id % 3 === 1 -> жёлто-зелёный фон */
        name: 'Фоллаут',
        original_name: 'Fallout',
        overview: 'Через двести лет после ядерной войны обитатели роскошных убежищ вынуждены вернуться на радиоактивную пустошь, оставленную их предками, и с удивлением обнаруживают там невероятно сложный мир.',
        first_air_date: '2024-04-10',
        number_of_seasons: 2,
        number_of_episodes: 16,
        vote_average: 8.3,
        imdb_id: 'tt12637874',
        imdb_rating: 8.4,
        kp_rating: 7.8,
        status: 'Returning Series',
        tagline: '',
        backdrop_path: '/kNGsMVBSjqmT3pvFPGJxnJHNVyz.jpg',
        poster_path: '/AnsSIT9g46WNSbHKDSxUOFqQfxa.jpg',
        genres: [{ name: 'фантастика' }, { name: 'драма' }],
        production_countries: [{ name: 'США' }],
        next_episode_to_air: { air_date: nextEpisodeDate() },
        __pg: '18+'
    };

    function nextEpisodeDate() {
        var d = new Date();
        d.setDate(d.getDate() + 31);
        return [d.getFullYear(), pad(d.getMonth() + 1), pad(d.getDate())].join('-');
    }
    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    var CAST_MOVIE = names(['Тимоти Шаламе', 'Зендея', 'Ребекка Фергюсон', 'Хавьер Бардем', 'Остин Батлер',
        'Флоренс Пью', 'Дэйв Батиста', 'Кристофер Уокен', 'Леа Сейду', 'Стеллан Скарсгард',
        'Шарлотта Рэмплинг', 'Джош Бролин', 'Сухейла Якуб', 'Аня Тейлор-Джой', 'Бабс Олусанмокун',
        'Роджер Юань', 'Тим Блейк Нельсон']);

    var CAST_SERIAL = names(['Элла Пернелл', 'Аарон Мотен', 'Уолтон Гоггинс', 'Кайл МакЛоклен', 'Мойзес Ариас',
        'Ксельда Чинн', 'Джонни Пембертон', 'Лесли Угеймс', 'Майкл Эмерсон', 'Сарита Чоудри']);

    function names(list) {
        var out = [];
        for (var i = 0; i < list.length; i++) out.push({ name: list[i], character: '', profile_path: null });
        return out;
    }

    /* Прогресс просмотра: фильм 43%, сериал S2E3 32% */
    L.Timeline.setup(L.Utils.hash(MOVIE.original_title), { percent: 43, time: 4320, duration: 9960, updated: 1700000000000 });
    L.Timeline.setup(L.Utils.hash([2, '', 3, SERIAL.original_name].join('')), { percent: 32, time: 1120, duration: 3492, updated: 1700000000000 });
    L.Timeline.setup(L.Utils.hash([1, '', 8, SERIAL.original_name].join('')), { percent: 100, time: 3400, duration: 3400, updated: 1600000000000 });

    /* ------------------- Эмуляция Start.create() ------------------- */
    function createStart(data) {
        var card = data.movie;

        if (!card.title) card.title = card.name;
        if (!card.original_title) card.original_title = card.original_name;
        if (!card.runtime) card.runtime = 0;

        var genres = [];
        var src = card.genres || [{ name: '---' }];
        for (var g = 0; g < src.length && g < 3; g++) genres.push(L.Utils.capitalizeFirstLetter(src[g].name));
        genres = genres.join(', ');

        var countries = L.TMDB.parseCountries(card);
        var seasons = L.Utils.countSeasons(card);
        var tmdb_rating = parseFloat((card.vote_average || 0) + '').toFixed(1);
        if (tmdb_rating >= 10) tmdb_rating = 10;

        var relise = (card.release_date || card.first_air_date || '') + '';
        var year = relise ? relise.slice(0, 4) : '';
        var quality = !card.first_air_date ? (card.release_quality || card.quality) : false;
        var pg = L.TMDB.parsePG(card);
        var head = [];
        var info = [];

        var html = L.Template.get('full_start_new', {
            title: card.title,
            original_title: card.original_title,
            descr: L.Utils.substr(card.overview || L.Lang.translate('full_notext'), 420),
            time: L.Utils.secondsToTime(card.runtime * 60, true),
            genres: L.Utils.substr(genres, 30),
            rating: tmdb_rating,
            seasons: seasons,
            countries: countries.join(', '),
            episodes: card.number_of_episodes,
            tagline: card.tagline
        });

        if (!window.lampa_settings.torrents_use) html.find('.view--torrent').addClass('hide');

        if (card.name) html.find('.full-start-new__poster').addClass('card--tv').append('<div class="card__type">TV</div>');

        if (year) {
            html.find('.tag--year').removeClass('hide').find('> div').text(year);
            head.push('<span>' + year + '</span>');
        }

        if (countries.length) head.push(countries.slice(0, 5).join(' | '));

        if (!card.tagline) html.find('.full--tagline').remove();
        if (!card.tagline && card.title.length > 25) html.find('.full-start-new__title').addClass('twolines');

        if (card.runtime > 0) info.push('<span>' + L.Utils.secondsToTime(card.runtime * 60, true) + '</span>');
        if (seasons) info.push('<span>' + L.Lang.translate('title_seasons') + ': ' + seasons + '</span>');
        if (pg) html.find('.full-start__pg').removeClass('hide').text(pg);
        if (card.number_of_episodes) info.push('<span>' + L.Lang.translate('title_episodes') + ': ' + card.number_of_episodes + '</span>');
        if (!card.runtime) $('.tag--time', html).remove();
        if (card.number_of_seasons) html.find('.is--serial').removeClass('hide');
        if (card.vote_average === 0) html.find('.rate--tmdb').addClass('hide');

        if (card.status) {
            html.find('.full-start__status').removeClass('hide')
                .text(L.Lang.translate('tv_status_' + card.status.toLowerCase().replace(/ /g, '_')));
        }

        if (card.imdb_rating && parseFloat(card.imdb_rating) > 0) {
            html.find('.rate--imdb').removeClass('hide').find('> div').eq(0)
                .text(parseFloat(card.imdb_rating) >= 10 ? 10 : card.imdb_rating);
        }
        if (card.kp_rating && parseFloat(card.kp_rating) > 0) {
            html.find('.rate--kp').removeClass('hide').find('> div').eq(0)
                .text(parseFloat(card.kp_rating) >= 10 ? 10 : card.kp_rating);
        }

        if (card.genres) {
            var g5 = [];
            for (var i = 0; i < card.genres.length && i < 5; i++) g5.push(L.Utils.capitalizeFirstLetter(card.genres[i].name));
            info.push('<span>' + g5.join(' | ') + '</span>');
        }

        if (quality) {
            html.find('.tag--quality').removeClass('hide').find('> div').text(quality);
            info.push('<span>' + L.Lang.translate('player_quality') + ': ' + ('' + quality).toUpperCase() + '</span>');
        }

        if (card.next_episode_to_air) {
            var air = L.Utils.parseToDate(card.next_episode_to_air.air_date);
            var day = Math.ceil((air.getTime() - Date.now()) / (24 * 60 * 60 * 1000));
            var txt = L.Lang.translate('full_next_episode') + ': ' + L.Utils.parseTime(card.next_episode_to_air.air_date).short +
                ' / ' + L.Lang.translate('full_episode_days_left') + ': ' + day;
            if (day > 0) {
                $('.tag--episode', html).removeClass('hide').find('div').text(txt);
                info.push('<span>' + txt + '</span>');
            }
        }

        html.find('.full-start-new__head').toggleClass('hide', !head.length).html(head.join(', '));
        html.find('.full-start-new__details').html(info.join('<span class="full-start-new__split">●</span>'));

        return html;
    }

    /* ------------------------- Рендер ------------------------------ */
    var current = 'movie';
    /* Task 9: последние данные и узел ряда описания — нужны проверке отзывов
       (перерисовка без ключа, экран 13). */
    var LAST_DATA = null;
    var LAST_DESCR = null;

    function render() {
        var movie = current === 'movie' ? MOVIE : SERIAL;
        var data = { movie: movie, persons: { cast: current === 'movie' ? CAST_MOVIE : CAST_SERIAL, crew: [] } };

        var component = $('#component');
        component.find('.lumen-backdrop').remove();
        component.find('.full-start__background').remove();
        component.find('.scroll__body').empty();

        /* Lampa добавляет фоновое изображение в корень компонента */
        component.prepend($(L.Template.elem('img', { 'class': 'full-start__background' })));

        var html = createStart(data);
        component.find('.scroll__body').append(html);

        var item = { render: function () { return html; } };

        /* Task 5d/9: ряд описания Lampa (items_line -> .items-line__body ->
           .full-descr -> .full-descr__left). В стенде он собирается вручную:
           плагин дописывает в него таблицу «ПОДРОБНО» и ряд отзывов. */
        var descr = $('<div class="items-line items-line--type-cards">' +
            '<div class="items-line__head"><div class="items-line__title">Подробно</div></div>' +
            '<div class="items-line__body">' +
            '<div class="full-descr">' +
            '<div class="full-descr__left">' +
            '<div class="full-descr__text selector">' + (movie.overview || '') + '</div>' +
            '<div class="full-descr__details"></div>' +
            '<div class="full-descr__tags"><div class="full-descr__tag selector">Жанр</div></div>' +
            '</div></div></div></div>');
        component.find('.scroll__body').append(descr);

        LAST_DATA = data;
        LAST_DESCR = descr;

        L.Listener.send('full', { link: {}, type: 'build', props: {}, body: component, object: {}, name: 'start', item: item, data: data });
        L.Listener.send('full', { link: {}, type: 'build', props: {}, body: component, object: {}, name: 'description', item: { render: function () { return descr; } }, data: data });
        L.Listener.send('full', { link: {}, type: 'complite', props: {}, body: component, object: {}, data: data });

        focusIndex = 0;
        applyFocus();
        runChecks(html);
        /* Отзывы приходят асинхронно: мок Reguest отвечает через setTimeout. */
        setTimeout(function () { runReviewChecks(descr); }, 30);
    }

    /* --------------------- Эмуляция пульта -------------------------- */
    var focusIndex = 0;
    function selectors() { return $('#component .full-start-new__buttons .selector').not('.hide'); }
    function applyFocus() {
        var list = selectors();
        list.removeClass('focus');
        if (!list.length) return;
        if (focusIndex < 0) focusIndex = 0;
        if (focusIndex > list.length - 1) focusIndex = list.length - 1;
        list.eq(focusIndex).addClass('focus');
    }
    $(document).on('keydown', function (e) {
        if (e.keyCode === 39) { focusIndex++; applyFocus(); e.preventDefault(); }
        if (e.keyCode === 37) { focusIndex--; applyFocus(); e.preventDefault(); }
    });

    /* ------------------------- Проверки ----------------------------- */
    function runChecks(html) {
        var need = [
            '.full-start-new__title', '.full-start-new__head',
            '.full-start-new__details', '.full-start-new__reactions', '.full-start-new__buttons',
            '.buttons--container', '.button--play', '.button--book', '.button--reaction',
            '.button--subscribe', '.button--options', '.view--torrent', '.view--trailer',
            '.rate--tmdb', '.rate--imdb', '.rate--kp', '.tag--year', '.tag--time', '.tag--quality',
            '.tag--episode', '.full-start__pg', '.full-start__status', '.is--serial',
            '.full-start-new__poster img.full--poster'
        ];
        var out = [];
        var failed = 0;
        for (var i = 0; i < need.length; i++) {
            var sel = need[i];
            var found = html.find(sel).length || (html.is(sel) ? 1 : 0);
            /* tag--time удаляется движком, когда нет runtime — это штатно */
            if (!found && sel === '.tag--time' && !(current === 'movie')) found = -1;
            if (!found) failed++;
            out.push('<div class="' + (found ? 'ok' : 'fail') + '">' + (found ? 'OK  ' : 'FAIL') + ' ' + sel + '</div>');
        }

        var sels = html.find('.selector').length;
        out.push('<div class="' + (sels >= 6 ? 'ok' : 'fail') + '">' + (sels >= 6 ? 'OK  ' : 'FAIL') + ' .selector в карточке: ' + sels + '</div>');

        var lumen = html.hasClass('lumen-card');
        out.push('<div class="' + (lumen ? 'ok' : 'fail') + '">' + (lumen ? 'OK  ' : 'FAIL') + ' шаблон подменён (.lumen-card)</div>');

        var meta = html.find('.lumen-meta').text().length > 0;
        out.push('<div class="' + (meta ? 'ok' : 'fail') + '">' + (meta ? 'OK  ' : 'FAIL') + ' мета-строка заполнена</div>');

        var prog = !html.find('.lumen-progress').hasClass('hide');
        out.push('<div class="' + (prog ? 'ok' : 'fail') + '">' + (prog ? 'OK  ' : 'FAIL') + ' «Продолжить» видна</div>');

        /* Правка 2026-09-16 (п.1): блока «В ролях» больше нет — вместо него
           проверяем, что статус переехал в ленту рейтингов. */
        var statusOk = html.find('.full-start-new__rate-line > .full-start__status').length === 1;
        out.push('<div class="' + (statusOk ? 'ok' : 'fail') + '">' + (statusOk ? 'OK  ' : 'FAIL') + ' статус — в ленте рейтингов</div>');

        var bd = $('#component .lumen-backdrop').length;
        out.push('<div class="' + (bd ? 'ok' : 'fail') + '">' + (bd ? 'OK  ' : 'FAIL') + ' слой бэкдропа создан</div>');

        /* Узлы, которые Lampa удаляет по данным, проверяем в сыром шаблоне */
        var raw = $(L.Lang.translate(L.Template.all().full_start_new));
        var rawNeed = ['.full--tagline', '.tag--time', '.tag--year', '.is--serial'];
        for (var r = 0; r < rawNeed.length; r++) {
            var has = raw.find(rawNeed[r]).length > 0;
            if (!has) failed++;
            out.push('<div class="' + (has ? 'ok' : 'fail') + '">' + (has ? 'OK  ' : 'FAIL') + ' ' + rawNeed[r] + ' (в шаблоне)</div>');
        }

        /* Task 5a Step 2: .lumen-content — единственный родитель шести
           .lumen-in (соседние дети, stagger Task 4 считает nth-child(1..6)).
           Правка 2026-09-16 (п.1): седьмого ребёнка .lumen-side больше нет —
           боковая колонка убрана, .lumen-content стал одноколоночным. */
        var extra = 0;
        var content = html.find('.lumen-content');
        var contentOk = content.length > 0;
        if (!contentOk) failed++;
        extra++;
        out.push('<div class="' + (contentOk ? 'ok' : 'fail') + '">' + (contentOk ? 'OK  ' : 'FAIL') + ' .lumen-content присутствует</div>');

        var inCount = content.children('.lumen-in').length;
        var inOk = inCount === 6;
        if (!inOk) failed++;
        extra++;
        out.push('<div class="' + (inOk ? 'ok' : 'fail') + '">' + (inOk ? 'OK  ' : 'FAIL') + ' .lumen-in — ровно 6 прямых потомков .lumen-content: ' + inCount + '</div>');

        var sideOk = content.children('.lumen-side').length === 0 && content.children().length === 6;
        if (!sideOk) failed++;
        extra++;
        out.push('<div class="' + (sideOk ? 'ok' : 'fail') + '">' + (sideOk ? 'OK  ' : 'FAIL') + ' у .lumen-content ровно шесть детей, боковой колонки нет</div>');

        out.unshift('<div><b>Проверки: ' + (need.length + rawNeed.length + extra - failed) + '/' + (need.length + rawNeed.length + extra) + ' узлов Lampa на месте</b></div>');
        document.getElementById('checks').innerHTML = out.join('');
    }

    /* Task 9: ряд отзывов Кинопоиска (экран 07) и подсказка без ключа
       (экран 13). Сеть подменена моком Reguest — реальный ключ не нужен. */
    function runReviewChecks(descr) {
        var out = ['<div><b>Отзывы Кинопоиска (Task 9)</b></div>'];

        /* Ревью фазы 1 (DEF-01): на выключенном плагине проверки отзывов
           пропускаются целиком. Причина — в двух прямых вызовах
           window.lumen_card.reviews.render() ниже: это инструмент СТЕНДА, а не
           путь плагина. LC.reviews.render читает только lumen_reviews и
           lumen_kp_key и про главный выключатель lumen_enabled не знает, потому
           что штатно его зовут лишь из подписки 'full' и LC.applyReviewsPref —
           обе закрыты гейтом activated. Здесь же он звался напрямую и возвращал
           .lumen-reviews в .full-descr, который выключатель только что раздел
           (порядок в toggleBtn: Storage.set -> deactivate/stripAllCards ->
           render() -> через 30 мс runReviewChecks). Приёмка фазы 1 приняла
           именно это за дефект уборки; в живой Lampa узел снимается корректно —
           проверено на «Дюне» (693134): после lumen_enabled='false' в DOM ноль
           .lumen-reviews, .lumen-facts, .lumen-progress и .lumen-descr-row. */
        /* Ревью фазы 1, второй круг (Minor 8): нормализуем ТЕМ ЖЕ кодом, что и
           плагин. Живая Lampa хранит переключатели строками 'true'/'false'
           (план 0.2), а голый Storage.get на строке 'false' вернул бы истину —
           гейт не сработал бы, и стенд снова дорисовал бы ряд в обход
           выключателя. Именно расхождение стенда с плагином породило ложный
           DEF-01, второго такого быть не должно. */
        var enabledRaw = L.Storage.get('lumen_enabled', true);
        var enabled = (window.lumen_card && window.lumen_card.prefs)
            ? window.lumen_card.prefs.boolOf(enabledRaw, true)
            : enabledRaw;
        if (!enabled) {
            out.push('<div class="hint">плагин выключен — проверки отзывов пропущены (стенд не должен дорисовывать ряд в обход выключателя)</div>');
            document.getElementById('checks').innerHTML += out.join('');
            return;
        }

        function check(ok, text) {
            out.push('<div class="' + (ok ? 'ok' : 'fail') + '">' + (ok ? 'OK  ' : 'FAIL') + ' ' + text + '</div>');
        }

        var block = descr.find('.lumen-reviews');
        var cards = descr.find('.lumen-review');
        check(block.length === 1, 'блок отзывов вставлен в ряд описания');
        check(descr.find('.lumen-facts').length === 1, 'таблица «ПОДРОБНО» на месте (соседи не мешают друг другу)');
        check(cards.length === 3, 'карточек отзывов: ' + cards.length);
        check(cards.length > 0 && cards.filter('.selector').length === cards.length, 'все карточки — .selector');
        check(block.find('.lumen-reviews__src').text().indexOf('КИНОПОИСК') !== -1, 'источник в заголовке');
        check(block.find('.lumen-reviews__total').text().indexOf('318') !== -1, 'число отзывов из total ответа');
        check(descr.find('.lumen-review--good').length > 0 && descr.find('.lumen-review--bad').length > 0, 'тон отзывов размечен классами');
        check(descr.hasClass('lumen-descr-row--reviews'), 'описание поджато, пока ряд отзывов на месте');
        check(L.Controller.appended > 0, 'новые .selector отданы контроллеру: ' + (L.Controller.appended || 0));

        /* Экран 13: без ключа вместо ряда — подсказка, где ключ взять. */
        var key = L.Storage.get('lumen_kp_key', '');
        L.Storage.set('lumen_kp_key', '');
        window.lumen_card.reviews.render(descr, LAST_DATA);
        check(descr.find('.lumen-reviews__hint').length === 1, 'без ключа — подсказка экрана 13');
        check(descr.find('.lumen-review').length === 0, 'в подсказке нечего фокусировать');
        L.Storage.set('lumen_kp_key', key);
        window.lumen_card.reviews.render(descr, LAST_DATA);

        document.getElementById('checks').innerHTML += out.join('');
    }

    /* --------------------------- UI --------------------------------- */
    $('#btn-movie').on('click', function () { current = 'movie'; $('#btn-movie').addClass('on'); $('#btn-serial').removeClass('on'); render(); });
    $('#btn-serial').on('click', function () { current = 'serial'; $('#btn-serial').addClass('on'); $('#btn-movie').removeClass('on'); render(); });

    $('#panel [data-accent]').on('click', function () {
        $('#panel [data-accent]').removeClass('on');
        $(this).addClass('on');
        L.Storage.set('lumen_card_accent', $(this).attr('data-accent'));
    });

    function toggleBtn(id, key) {
        $(id).on('click', function () {
            var on = !$(this).hasClass('on');
            $(this).toggleClass('on', on);
            L.Storage.set(key, on);
            render();
        });
    }
    toggleBtn('#btn-fonts', 'lumen_card_fonts');
    toggleBtn('#btn-progress', 'lumen_card_progress');
    /* Task 10: главный выключатель — руками. «Выкл» возвращает штатный шаблон
       Lampa, поэтому следующий render() рисует карточку без Lumen. */
    toggleBtn('#btn-enabled', 'lumen_enabled');

    /* ------------------------ Масштаб ------------------------------- */
    function fit() {
        var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var stage = document.getElementById('stage');
        stage.style.webkitTransform = 'scale(' + scale + ')';
        stage.style.transform = 'scale(' + scale + ')';
    }
    $(window).on('resize', fit);
    fit();

    render();
})();
</script>
</body>
</html>
